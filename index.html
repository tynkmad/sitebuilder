<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webprofile Builder</title>
    <style>
      #app-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #333;
        text-align: center;
        padding: 2rem;
      }
      #app-fallback button {
        padding: 0.6rem 1.4rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 1rem;
      }
      #app-fallback button:hover {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="app-fallback"><div id="app-fallback-message">Loading&hellip;</div></div></div>
    <noscript>
      <div id="app-fallback">This app requires JavaScript to be enabled in your browser.</div>
    </noscript>
    <script>
      (function () {
        function showError() {
          var msg = document.getElementById("app-fallback-message");
          if (!msg) return;
          msg.innerHTML =
            "Something went wrong loading this page.<br />Please refresh, or try again in a moment." +
            '<br /><br /><button onclick="location.reload()">Reload</button>';
        }
        window.addEventListener(
          "error",
          function (e) {
            var target = e.target;
            if (target && target !== window && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              showError();
            }
          },
          true
        );
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
